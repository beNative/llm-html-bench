<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- HTML / Code Accent Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- AI Spark Purple Gradient -->
    <linearGradient id="purplePinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Layer Glow Gradients -->
    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    
    <linearGradient id="layerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="140" r="110" fill="#38bdf8" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="390" cy="370" r="130" fill="#818cf8" opacity="0.14" filter="url(#softGlow)" />

  <!-- Grid / Benchmark Metric Matrix -->
  <g opacity="0.18" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 6">
    <line x1="80" y1="180" x2="432" y2="180" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="332" x2="432" y2="332" />
    <line x1="180" y1="80" x2="180" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="332" y1="80" x2="332" y2="432" />
  </g>

  <!-- Benchmark Layered Stack (Back Card) -->
  <rect x="136" y="112" width="240" height="170" rx="20" fill="url(#layerGrad1)" stroke="#475569" stroke-width="2" opacity="0.6" />
  
  <!-- Benchmark Layered Stack (Middle Card) -->
  <rect x="116" y="140" width="280" height="190" rx="22" fill="url(#layerGrad2)" stroke="#64748b" stroke-width="2.5" opacity="0.85" />

  <!-- Front Benchmark Display Card -->
  <rect x="96" y="172" width="320" height="220" rx="24" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Browser/Window Header Dots -->
  <circle cx="126" cy="202" r="6" fill="#ef4444" opacity="0.85" />
  <circle cx="146" cy="202" r="6" fill="#f59e0b" opacity="0.85" />
  <circle cx="166" cy="202" r="6" fill="#10b981" opacity="0.85" />
  
  <!-- Card Header Line -->
  <line x1="96" y1="224" x2="416" y2="224" stroke="#334155" stroke-width="2" />

  <!-- HTML Tag Symbol: < / > (Stylized, Bold, Glowing) -->
  <!-- Left Bracket < -->
  <path d="M 192 260 L 148 296 L 192 332" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Slash / -->
  <line x1="240" y1="344" x2="272" y2="248" stroke="#94a3b8" stroke-width="10" stroke-linecap="round" />

  <!-- Right Bracket > -->
  <path d="M 320 260 L 364 296 L 320 332" fill="none" stroke="url(#purplePinkGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AI Intelligence Star / Spark (Top Right of the App Window) -->
  <g transform="translate(376, 120)" filter="url(#sparkGlow)">
    <path d="M 0 -26 Q 0 0 26 0 Q 0 0 0 26 Q 0 0 -26 0 Q 0 0 0 -26 Z" fill="url(#purplePinkGrad)" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>

  <!-- Mini Sparkle -->
  <g transform="translate(136, 108)" opacity="0.7">
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#38bdf8" />
  </g>

  <!-- Performance Metric Bars on Bottom Right of Card -->
  <rect x="296" y="362" width="22" height="12" rx="3" fill="#38bdf8" />
  <rect x="324" y="354" width="22" height="20" rx="3" fill="#818cf8" />
  <rect x="352" y="344" width="22" height="30" rx="3" fill="#c084fc" />
  <rect x="380" y="334" width="22" height="40" rx="3" fill="#10b981" />
</svg>
